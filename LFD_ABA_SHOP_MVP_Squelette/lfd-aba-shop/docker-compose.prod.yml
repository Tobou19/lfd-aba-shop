# Déploiement de production à coût zéro : Caddy termine le HTTPS
# automatiquement via Let's Encrypt (gratuit), et route vers le backend
# et le frontend. Fonctionne aussi bien sur un serveur Oracle Cloud
# "Always Free" que sur du matériel déjà possédé par LFD-Services — voir
# FREE_DEPLOYMENT.md pour le détail des options gratuites.
#
# Les secrets (DATABASE_URL, JWT_*, identifiants opérateur mobile money)
# sont fournis par l'environnement d'exécution, jamais commités ici.
services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: https://${DOMAINE}
      NODE_ENV: production
      # 'local' : stockage disque gratuit, monté ci-dessous et servi
      # directement par Caddy — voir FREE_DEPLOYMENT.md, point 4.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /app/storage
      STORAGE_PUBLIC_BASE_URL: https://${DOMAINE}/files
      MOBILE_MONEY_WEBHOOK_SECRET: ${MOBILE_MONEY_WEBHOOK_SECRET}
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAINE: ${DOMAINE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - storage:/srv/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
