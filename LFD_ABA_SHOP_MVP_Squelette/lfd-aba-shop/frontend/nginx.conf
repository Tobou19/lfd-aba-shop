server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA : chaque route côté client retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker et le manifest ne doivent jamais être mis en
    # cache par un proxy intermédiaire, sous peine de bloquer les
    # mises à jour de l'application sur les téléphones déjà installés.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # L'application ne doit jamais apparaître dans un moteur de recherche
    # public (voir SECURITY.md, point 4).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}
