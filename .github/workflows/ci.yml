name: CI

# Se déclenche sur chaque pull request et sur chaque push vers main —
# c'est la porte avant tout déploiement, cf. Document de Conception
# Technique §7.3 (intégration continue).
on:
  pull_request:
  push:
    branches: [main]

jobs:

  backend:
    name: Backend — lint, build, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfd_user
          POSTGRES_PASSWORD: lfd_test_password
          POSTGRES_DB: lfd_aba_shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lfd_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lfd_user:lfd_test_password@localhost:5432/lfd_aba_shop_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Appliquer le schéma sur la base de test
        # `db push` tant qu'aucune migration n'est encore committée dans
        # prisma/migrations/. Dès la première migration réelle générée en
        # local (`npm run prisma:migrate`), remplacer par
        # `npx prisma migrate deploy` pour valider les migrations elles-mêmes.
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm test -- --coverage

      - name: Tests e2e
        run: npm run test:e2e

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (échoue si le typage ou le build casse)
        run: npm run build

  docker-images:
    name: Construire les images Docker
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre d'images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build + push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      # Déploiement vers l'environnement de recette : à brancher sur
      # l'hébergeur retenu (§7.1) — ex. déclenchement d'un webhook, ou
      # `docker compose -f docker-compose.prod.yml pull && up -d` via SSH.
      # Le passage en production reste une validation manuelle distincte
      # (cf. Document de Conception Technique §7.3).
