<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Sky -->
  <rect width="600" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="350" width="600" height="50" fill="#8B4513"/>
  
  <!-- Building -->
  <rect x="100" y="100" width="400" height="250" fill="#90EE90"/>
  <rect x="100" y="100" width="400" height="30" fill="#8B008B"/>
  
  <!-- Windows -->
  <rect x="130" y="150" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="210" y="150" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="290" y="150" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="370" y="150" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  
  <rect x="130" y="230" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="210" y="230" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="290" y="230" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <rect x="370" y="230" width="60" height="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="260" y="300" width="80" height="50" fill="#8B4513" stroke="#333" stroke-width="2"/>
  
  <!-- Sign -->
  <rect x="200" y="120" width="200" height="40" fill="#1E5C48"/>
  <text x="300" y="145" font-family="Arial" font-size="20" fill="white" text-anchor="middle">LFD-Services</text>
  
  <!-- Fence -->
  <rect x="50" y="320" width="10" height="50" fill="#654321"/>
  <rect x="100" y="320" width="10" height="50" fill="#654321"/>
  <rect x="150" y="320" width="10" height="50" fill="#654321"/>
  <rect x="200" y="320" width="10" height="50" fill="#654321"/>
  <rect x="250" y="320" width="10" height="50" fill="#654321"/>
  <rect x="300" y="320" width="10" height="50" fill="#654321"/>
  <rect x="350" y="320" width="10" height="50" fill="#654321"/>
  <rect x="400" y="320" width="10" height="50" fill="#654321"/>
  <rect x="450" y="320" width="10" height="50" fill="#654321"/>
  <rect x="500" y="320" width="10" height="50" fill="#654321"/>
  <rect x="550" y="320" width="10" height="50" fill="#654321"/>
  
  <rect x="50" y="320" width="510" height="5" fill="#654321"/>
